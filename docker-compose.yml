version: '3.8'

services:
  webapp:
    container_name: netwise-webapp
    build:
      context: ./WebApp
      dockerfile: Dockerfile
    ports:
      - "5205:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080

  frontend:
    container_name: netwise-frontend
    build:
      context: ./FrontApp
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - webapp
